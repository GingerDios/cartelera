
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
    <title>Tec5 Cartelera</title>
</head>
<body>

    <header>

        <div class="logo">
            <img src="logo.png" alt="E.E.S.T. N°5">
        </div>

        <div class="espacio"></div>

        <h2>Admin</h2>

    </header>

    <section>

        <div class="contenedor">

            <div class="titulo">
                <h1>Videos</h1>
                <p>Busca videos por nombre o etiqueta</p>
            </div>

            <div class="buscador">
                <input type="text" placeholder="Buscar por nombre o etiqueta...">
                <button type="button">Buscar</button>
            </div>

            <div class="filtros">
                <button type="button">Todos</button>
                <button type="button">Informática</button>
                <button type="button">Electrónica</button>
                <button type="button">Construcciones</button>
            </div>

            <div class="videos">

                <div class="vacio">
                    <h3>No hay videos disponibles</h3>
                    <p>Los videos enviados aparecerán aquí cuando sean agregados a la cartelera</p>
                </div>

            </div>

        </div>

    </section>

    <footer>
        <p>E.E.S.T. N°5</p>
    </footer>

</body>
</html>
